# Test Configuration - Uses In-Memory H2 with MySQL mode for fast, isolated testing
spring.datasource.url=jdbc:h2:mem:ubi_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keep Actuator endpoints exposed in test
management.endpoints.web.exposure.include=health,info

# Step 4 Test Configurations
app.trips.inactivity-threshold-minutes=10
app.features.harsh-braking-threshold-g=-0.35
app.features.rapid-accel-threshold-g=0.30
app.features.speeding-threshold-kmh=120.0
app.features.night-start-hour=22
app.features.night-end-hour=5
app.features.timezone=Asia/Kolkata
app.features.calculation-version=v1.0
app.risk.scoring-version=v1.0
app.risk.base-score=100.0
app.risk.harsh-braking-weight=2.0
app.risk.harsh-braking-cap=30.0
app.risk.rapid-accel-weight=1.5
app.risk.rapid-accel-cap=25.0
app.risk.speeding-weight=2.5
app.risk.speeding-cap=35.0
app.risk.speed-severity-threshold-kmh=130.0
app.risk.speed-severity-weight=0.5
app.risk.night-driving-max-penalty=5.0
app.risk.night-driving-cap=5.0
app.risk.min-distance-km=0.5
app.risk.min-valid-records=10
app.risk.min-duration-seconds=60
app.risk.min-data-quality-score=50.0
app.pricing.version=pricing-v1
app.pricing.currency=INR
app.pricing.base-annual-premium-inr=12000.00
app.pricing.min-premium-inr=5000.00
app.pricing.max-premium-inr=35000.00
app.pricing.multiplier.excellent=0.9000
app.pricing.multiplier.good=1.0000
app.pricing.multiplier.moderate=1.1500
app.pricing.multiplier.high-risk=1.3000
app.pricing.baseline-annual-distance-km=10000.0
app.pricing.min-observation-days-for-projection=7
app.pricing.min-observed-distance-km-for-projection=20.0
app.pricing.min-usage-multiplier=0.8000
app.pricing.max-usage-multiplier=1.3500
app.pricing.stale-score-days=90

# Step 8 Test Settings
app.security.bootstrap-insurer.enabled=false
app.security.bootstrap-customer.enabled=false

