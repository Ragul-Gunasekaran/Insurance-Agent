# ==============================================================================
# Usage-Based Insurance (UBI) Platform - Spring Boot Configuration
# ==============================================================================

# Application Identity & Server Configuration
spring.application.name=usage-based-insurance-backend
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# Session & Cookie Security Configuration (Production & Proxy Aware)
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# MySQL / TiDB Database Configuration (Environment Driven & Cloud Compatible)
spring.datasource.url=${SPRING_DATASOURCE_URL:${TIDB_JDBC_URL:jdbc:mysql://${DB_HOST:${TIDB_HOST:localhost}}:${DB_PORT:${TIDB_PORT:3306}}/${DB_NAME:${TIDB_DATABASE:usage_based_insurance}}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:${DB_USE_SSL:false}}&enabledTLSProtocols=${DB_TLS_PROTOCOLS:TLSv1.2,TLSv1.3}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${TIDB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${TIDB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_FAIL_TIMEOUT:-1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.pool-name=UbiHikariPool

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Boot Actuator Operational Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Custom Application & Security Settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.name=Usage-Based Insurance Platform
app.version=1.0.0-SNAPSHOT
app.description=Production-oriented prototype for telematics-driven dynamic insurance underwriting and actuarial risk scoring.

# Step 4: Trip Stitching Configuration
app.trips.inactivity-threshold-minutes=${TRIP_INACTIVITY_THRESHOLD_MINUTES:10}

# Step 4: Feature Engineering Engine Configuration
app.features.harsh-braking-threshold-g=${HARSH_BRAKING_THRESHOLD_G:-0.35}
app.features.rapid-accel-threshold-g=${RAPID_ACCEL_THRESHOLD_G:0.30}
app.features.speeding-threshold-kmh=${SPEEDING_THRESHOLD_KMH:120.0}
app.features.night-start-hour=${NIGHT_START_HOUR:22}
app.features.night-end-hour=${NIGHT_END_HOUR:5}
app.features.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.features.calculation-version=v1.0

# Step 5: Behavioral Risk Scoring Configuration
app.risk.scoring-version=v1.0
app.risk.base-score=100.0
app.risk.harsh-braking-weight=${RISK_HARSH_BRAKING_WEIGHT:2.0}
app.risk.harsh-braking-cap=${RISK_HARSH_BRAKING_CAP:30.0}
app.risk.rapid-accel-weight=${RISK_RAPID_ACCEL_WEIGHT:1.5}
app.risk.rapid-accel-cap=${RISK_RAPID_ACCEL_CAP:25.0}
app.risk.speeding-weight=${RISK_SPEEDING_WEIGHT:2.5}
app.risk.speeding-cap=${RISK_SPEEDING_CAP:35.0}
app.risk.speed-severity-threshold-kmh=130.0
app.risk.speed-severity-weight=0.5
app.risk.night-driving-max-penalty=${RISK_NIGHT_DRIVING_MAX_PENALTY:5.0}
app.risk.night-driving-cap=5.0
app.risk.min-distance-km=0.5
app.risk.min-valid-records=10
app.risk.min-duration-seconds=60
app.risk.min-data-quality-score=50.0

# Step 6: Actuarial Pricing Engine Configuration
app.pricing.version=pricing-v1
app.pricing.currency=INR
app.pricing.base-annual-premium-inr=${PRICING_BASE_ANNUAL_PREMIUM_INR:12000.00}
app.pricing.min-premium-inr=${PRICING_MIN_PREMIUM_INR:5000.00}
app.pricing.max-premium-inr=${PRICING_MAX_PREMIUM_INR:35000.00}
app.pricing.multiplier.excellent=0.9000
app.pricing.multiplier.good=1.0000
app.pricing.multiplier.moderate=1.1500
app.pricing.multiplier.high-risk=1.3000
app.pricing.baseline-annual-distance-km=10000.0
app.pricing.min-observation-days-for-projection=7
app.pricing.min-observed-distance-km-for-projection=20.0
app.pricing.min-usage-multiplier=0.8000
app.pricing.max-usage-multiplier=1.3500
app.pricing.stale-score-days=90

# Step 8: Security & Bootstrap Configuration
app.security.bootstrap-insurer.enabled=${BOOTSTRAP_INSURER_ENABLED:true}
app.security.bootstrap-insurer.email=${BOOTSTRAP_INSURER_EMAIL:insurer@trustdrive.internal}
app.security.bootstrap-insurer.password=${BOOTSTRAP_INSURER_PASSWORD:}
app.security.bootstrap-customer.enabled=${BOOTSTRAP_CUSTOMER_ENABLED:true}
app.security.bootstrap-customer.email=${BOOTSTRAP_CUSTOMER_EMAIL:customer@trustdrive.internal}
app.security.bootstrap-customer.password=${BOOTSTRAP_CUSTOMER_PASSWORD:}

