# ==============================================================================
# Usage-Based Insurance (UBI) Platform - Spring Boot Configuration
# ==============================================================================

# Application Identity & Server Configuration
spring.application.name=usage-based-insurance-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (Environment Driven)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:usage_based_insurance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings
# initialization-fail-timeout: -1 prevents pool failure from crashing JVM on boot when DB is temporarily offline
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=1500
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=UbiHikariPool

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Boot Actuator Operational Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Custom Application & Security Settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.name=Usage-Based Insurance Platform
app.version=1.0.0-SNAPSHOT
app.description=Production-oriented prototype for telematics-driven dynamic insurance underwriting and actuarial risk scoring.
